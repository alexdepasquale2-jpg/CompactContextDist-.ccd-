[project]
name = "ccd"
version = "1.0.0"
description = "Compact Context Distributable: a navigable plain-text context format."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ccd = "ccd.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ccd*"]
